<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUDIT - Auditoría documental</title>
  <link rel="stylesheet" href="./scan.styles.css" />
</head>
<body>
  <main class="page">
    <header class="page__header">
      <div>
        <h1>AUDIT</h1>
        <p>Auditoría documental local de UGPA y UTET.</p>
      </div>
      <nav class="header-nav">
        <button id="btnOpenDashboard" class="btn btn--ghost" type="button">Dashboard</button>
        <button id="btnOpenRules" class="btn btn--ghost" type="button">Reglas</button>
      </nav>
    </header>

    <div id="globalMessage" class="global-message" aria-live="polite"></div>

    <section class="source-grid">
      <article class="card source-card">
        <div class="card-head">
          <div>
            <span class="eyebrow">Origen</span>
            <h2>UGPA</h2>
          </div>
          <button id="btnSelectUgpa" class="btn btn--ghost" type="button">
            Seleccionar UGPA
          </button>
        </div>
        <div id="ugpaSourceBody" class="source-body"></div>
      </article>

      <article class="card source-card">
        <div class="card-head">
          <div>
            <span class="eyebrow">Origen</span>
            <h2>UTET</h2>
          </div>
          <button id="btnSelectUtet" class="btn btn--ghost" type="button">
            Seleccionar UTET
          </button>
        </div>
        <div id="utetSourceBody" class="source-body"></div>
      </article>
    </section>

    <section class="audit-bar card">
      <div>
        <strong>Auditoría</strong>
        <span>Puede ejecutar UGPA, UTET o ambas carpetas seleccionadas.</span>
      </div>
      <button id="btnAuditSelected" class="btn btn--primary" type="button">
        Auditar carpetas seleccionadas
      </button>
    </section>

    <section class="section">
      <div class="section-head"><h2>Resumen</h2></div>
      <div id="summaryGrid" class="summary-grid"></div>
    </section>

    <section class="bottom-grid">
      <article class="card compact-card">
        <div class="card-head">
          <div>
            <h2>Historial</h2>
            <p>Últimos resultados y descartes.</p>
          </div>
          <button id="btnOpenHistory" class="btn btn--ghost btn--small" type="button">
            Abrir
          </button>
        </div>
        <div id="historyInfo" class="small-path"></div>
      </article>

      <article class="card compact-card">
        <div class="card-head">
          <div>
            <h2>PDF</h2>
            <p>Exportar inventario.</p>
          </div>
        </div>
        <div class="export-row">
          <select id="exportMode" class="select">
            <option value="single-ugpa">Solo UGPA</option>
            <option value="single-utet">Solo UTET</option>
            <option value="both" selected>UGPA + UTET</option>
          </select>
          <button id="btnExportPdf" class="btn btn--primary" type="button">Exportar</button>
        </div>
        <div id="exportResultBox" class="export-box"></div>
      </article>
    </section>
  </main>

  <script src="../shared/app.store.js" defer></script>
  <script src="./scan.state.js" defer></script>
  <script src="./scan.service.js" defer></script>
  <script src="./scan.ui.js" defer></script>
  <script src="./scan.app.js" defer></script>
</body>
</html>
